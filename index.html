<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Clon Task Board</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="./Untitled.jpeg" />
  </head>

  <body>
    <div class="app">
      <!-- =========================
           HEADER
      ========================== -->
      <header class="header">
        <div>
          <span class="eyebrow">ClonKR Task Board</span>

          <h1>Daily Task Board</h1>

          <p>
            Track today's tasks, assignments and completed work.
          </p>
        </div>

        <div class="header-actions">
          <input type="date" id="datePicker" />

          <button id="addTaskBtn" class="primary-btn">
            + New Task
          </button>
        </div>
      </header>

      <!-- =========================
           FILTERS
      ========================== -->
      <section class="filters">
        <div class="filter-group">
          <span class="filter-label">Owner</span>

          <!-- Chips are generated by script.js from the
               options inside #taskOwner -->
          <div class="filter-chips" id="ownerFilters"></div>
        </div>

        <div class="filter-actions">
          <span class="filter-summary" id="filterSummary">
            Showing all tasks
          </span>

          <button id="resetBtn" class="secondary-btn">
            Reset UI
          </button>
        </div>
      </section>

      <!-- =========================
           STATISTICS
      ========================== -->
      <section class="stats">
        <div class="stat-card">
          <span>Total Tasks</span>
          <strong id="totalTasks">0</strong>
        </div>

        <div class="stat-card">
          <span>In Progress</span>
          <strong id="progressTasks">0</strong>
        </div>

        <div class="stat-card">
          <span>Completed</span>
          <strong id="completedTasks">0</strong>
        </div>
      </section>

      <!-- =========================
           BOARD
      ========================== -->
      <main class="board">
        <!-- TODO -->
        <section class="column">
          <div class="column-header">
            <div>
              <h2>To Do</h2>
              <p>Tasks waiting to start</p>
            </div>

            <span id="todoCount" class="count">0</span>
          </div>

          <div id="todoList" class="task-list"></div>
        </section>

        <!-- IN PROGRESS -->
        <section class="column">
          <div class="column-header">
            <div>
              <h2>In Progress</h2>
              <p>Currently working on</p>
            </div>

            <span id="doingCount" class="count">0</span>
          </div>

          <div id="doingList" class="task-list"></div>
        </section>

        <!-- DONE -->
        <section class="column">
          <div class="column-header">
            <div>
              <h2>Done</h2>
              <p>Completed tasks</p>
            </div>

            <span id="doneCount" class="count">0</span>
          </div>

          <div id="doneList" class="task-list"></div>
        </section>
      </main>

      <!-- =========================
           ADD TASK MODAL
      ========================== -->
      <div id="modal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <span class="eyebrow">NEW TASK</span>
              <h2>Add Task</h2>
            </div>

            <button id="closeModal" class="close-btn">
              ×
            </button>
          </div>

          <form id="taskForm">
            <div class="form-group">
              <label for="taskName">
                Task Name
              </label>

              <input
                type="text"
                id="taskName"
                placeholder="Example: Build Login Page"
                required
              />
            </div>

            <div class="form-group">
              <label for="taskOwner">
                Assigned To
              </label>

              <!-- Add / rename owners here — the filter chips
                   and the avatar colours adapt automatically -->
              <select id="taskOwner">
                <option value="Ali">Ali</option>
                <option value="Mohamed">Mohamed</option>
              </select>
            </div>

            <div class="form-group">
              <label for="taskNotes">
                Notes
              </label>

              <textarea
                id="taskNotes"
                placeholder="Task details..."
              ></textarea>
            </div>

            <div class="form-actions">
              <button
                type="button"
                id="cancelBtn"
                class="secondary-btn"
              >
                Cancel
              </button>

              <button
                type="submit"
                class="primary-btn"
              >
                Add Task
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- =========================
         SUPABASE SDK
    ========================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- =========================
         APP SCRIPT
    ========================== -->
    <script src="script.js"></script>
  </body>
</html>
